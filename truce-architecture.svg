<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2000" viewBox="0 0 3000 2000">
  <defs>
    <!-- Background & accent gradients -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="radialGlowTop" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#1d4ed8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radialGlowBottom" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="accentGradientBluePurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="iconGradientBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="iconGradientPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Soft card shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="12" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L18,9 L0,18 Z" fill="#60a5fa" />
    </marker>

    <!-- Typography & classes -->
    <style><![CDATA[
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      }
      .title {
        font-size: 46px;
        font-weight: 600;
        letter-spacing: 0.05em;
        fill: #e5e7eb;
      }
      .subtitle {
        font-size: 24px;
        fill: #9ca3af;
      }
      .column-label-text {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        fill: #e5e7eb;
      }
      .column-label-caption {
        font-size: 18px;
        fill: #9ca3af;
      }
      .card-title {
        font-size: 26px;
        font-weight: 600;
        fill: #e5e7eb;
      }
      .card-subtitle {
        font-size: 20px;
        fill: #9ca3af;
      }
      .card-body {
        font-size: 20px;
        fill: #d1d5db;
      }
      .icon-label {
        font-size: 18px;
        font-weight: 600;
        fill: #e5e7eb;
      }
      .footnote {
        font-size: 18px;
        fill: #6b7280;
      }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="3000" height="2000" fill="url(#bgGradient)"/>
  <rect width="3000" height="900" fill="url(#radialGlowTop)" opacity="0.9"/>
  <rect y="800" width="3000" height="1200" fill="url(#radialGlowBottom)" opacity="0.9"/>

  <!-- Main Title -->
  <text class="title" x="1500" y="100" text-anchor="middle">
    Truce Wallet — System Architecture
  </text>
  <text class="subtitle" x="1500" y="145" text-anchor="middle">
    Current Web App · Planned Blockchain Layer · AI &amp; Data Intelligence
  </text>

  <!-- Column Headers -->
  <!-- Column 1: Current System -->
  <g>
    <rect x="270" y="190" width="520" height="68" rx="34"
          fill="#020617" fill-opacity="0.95"
          stroke="url(#accentGradientBluePurple)" stroke-width="1.5"/>
    <circle cx="310" cy="224" r="18" fill="url(#iconGradientBlue)" opacity="0.9"/>
    <text class="column-label-text" x="530" y="214" text-anchor="middle">
      Current Web App
    </text>
    <text class="column-label-caption" x="530" y="240" text-anchor="middle">
      React + Supabase (live today)
    </text>
  </g>

  <!-- Column 2: Blockchain Flow -->
  <g>
    <rect x="1240" y="190" width="520" height="68" rx="34"
          fill="#020617" fill-opacity="0.95"
          stroke="url(#accentGradientBluePurple)" stroke-width="1.5"/>
    <circle cx="1280" cy="224" r="18" fill="url(#iconGradientPurple)" opacity="0.9"/>
    <text class="column-label-text" x="1500" y="214" text-anchor="middle">
      Blockchain &amp; Web3
    </text>
    <text class="column-label-caption" x="1500" y="240" text-anchor="middle">
      Planned on-chain integration
    </text>
  </g>

  <!-- Column 3: AI & Data -->
  <g>
    <rect x="2210" y="190" width="520" height="68" rx="34"
          fill="#020617" fill-opacity="0.95"
          stroke="url(#accentGradientBluePurple)" stroke-width="1.5"/>
    <circle cx="2250" cy="224" r="18" fill="url(#iconGradientBlue)" opacity="0.9"/>
    <text class="column-label-text" x="2470" y="214" text-anchor="middle">
      AI &amp; Data Layer
    </text>
    <text class="column-label-caption" x="2470" y="240" text-anchor="middle">
      Intelligence, APIs &amp; Edge Functions
    </text>
  </g>

  <!-- ========================= -->
  <!-- COLUMN 1 — CURRENT SYSTEM -->
  <!-- ========================= -->

  <!-- 1. React Frontend -->
  <g>
    <rect x="140" y="320" width="780" height="210" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="140" y="320" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <circle cx="190" cy="370" r="28" fill="url(#iconGradientBlue)"/>
    <text class="icon-label" x="190" y="376" text-anchor="middle">UI</text>

    <text class="card-title" x="240" y="360">React Frontend</text>
    <text class="card-subtitle" x="240" y="390">
      React · TypeScript · Tailwind CSS
    </text>

    <text class="card-body" x="240" y="430">
      <tspan x="240" dy="0">• Pages: Dashboard, Wallet, Swap, Market, Learn, AI Assistant</tspan>
      <tspan x="240" dy="30">• UI Components: shadcn/ui, Radix UI, Lucide icons</tspan>
    </text>
  </g>

  <!-- 2. Supabase Authentication -->
  <g>
    <rect x="140" y="580" width="780" height="170" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="140" y="580" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <circle cx="190" cy="630" r="26" fill="url(#iconGradientPurple)"/>
    <text class="icon-label" x="190" y="636" text-anchor="middle">Auth</text>

    <text class="card-title" x="240" y="615">Supabase Authentication</text>
    <text class="card-body" x="240" y="650">
      <tspan x="240" dy="0">• Email / password login</tspan>
      <tspan x="240" dy="28">• Session management</tspan>
      <tspan x="240" dy="28">• Protected routes in the frontend</tspan>
    </text>
  </g>

  <!-- 3. Supabase Database (Postgres) -->
  <g>
    <rect x="140" y="800" width="780" height="190" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="140" y="800" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <circle cx="190" cy="850" r="26" fill="url(#iconGradientBlue)"/>
    <text class="icon-label" x="190" y="856" text-anchor="middle">DB</text>

    <text class="card-title" x="240" y="835">Supabase Database (Postgres)</text>
    <text class="card-body" x="240" y="870">
      <tspan x="240" dy="0">• User profiles &amp; preferences</tspan>
      <tspan x="240" dy="28">• Learning progress</tspan>
      <tspan x="240" dy="28">• Saved AI queries</tspan>
      <tspan x="240" dy="28">• Portfolio metadata (off-chain)</tspan>
    </text>
  </g>

  <!-- 4. Supabase Storage (optional) -->
  <g>
    <rect x="140" y="1040" width="780" height="160" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="140" y="1040" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <circle cx="190" cy="1090" r="26" fill="url(#iconGradientPurple)"/>
    <text class="icon-label" x="190" y="1096" text-anchor="middle">FS</text>

    <text class="card-title" x="240" y="1080">Supabase Storage (optional)</text>
    <text class="card-body" x="240" y="1115">
      <tspan x="240" dy="0">• User assets (e.g. images, docs)</tspan>
      <tspan x="240" dy="28">• Related metadata</tspan>
    </text>
  </g>

  <!-- Column 1 Arrows -->
  <line x1="530" y1="542" x2="530" y2="568"
        stroke="#60a5fa" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrow)" opacity="0.9"/>
  <line x1="530" y1="762" x2="530" y2="788"
        stroke="#60a5fa" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrow)" opacity="0.9"/>
  <line x1="530" y1="1002" x2="530" y2="1028"
        stroke="#60a5fa" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrow)" opacity="0.9"/>

  <!-- ================================ -->
  <!-- COLUMN 2 — PLANNED BLOCKCHAIN   -->
  <!-- ================================ -->

  <!-- 1. Web3 Integration Layer (Ethers.js) -->
  <g>
    <rect x="1110" y="360" width="780" height="200" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="1110" y="360" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <circle cx="1160" cy="410" r="28" fill="url(#iconGradientBlue)"/>
    <text class="icon-label" x="1160" y="416" text-anchor="middle">W3</text>

    <text class="card-title" x="1210" y="400">Web3 Integration Layer (Ethers.js)</text>
    <text class="card-subtitle" x="1210" y="430">
      Wallet connection · RPC communication
    </text>

    <text class="card-body" x="1210" y="465">
      <tspan x="1210" dy="0">• Connect user wallets (MetaMask, etc.)</tspan>
      <tspan x="1210" dy="28">• Sign transactions &amp; messages</tspan>
      <tspan x="1210" dy="28">• RPC bridge to supported blockchains</tspan>
    </text>
  </g>

  <!-- 2. Solidity Smart Contracts -->
  <g>
    <rect x="1110" y="640" width="780" height="200" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="1110" y="640" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <circle cx="1160" cy="690" r="28" fill="url(#iconGradientPurple)"/>
    <text class="icon-label" x="1160" y="696" text-anchor="middle">SC</text>

    <text class="card-title" x="1210" y="680">Solidity Smart Contracts</text>
    <text class="card-body" x="1210" y="715">
      <tspan x="1210" dy="0">• Token swapping</tspan>
      <tspan x="1210" dy="28">• Staking mechanisms</tspan>
      <tspan x="1210" dy="28">• Portfolio records stored on-chain</tspan>
    </text>
  </g>

  <!-- 3. BlockDAG Network + Multi-Chain Support -->
  <g>
    <rect x="1110" y="920" width="780" height="200" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="1110" y="920" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <!-- Multi-chain icon: 4 small nodes -->
    <circle cx="1160" cy="970" r="10" fill="url(#iconGradientBlue)"/>
    <circle cx="1195" cy="945" r="10" fill="url(#iconGradientPurple)"/>
    <circle cx="1195" cy="995" r="10" fill="url(#iconGradientPurple)"/>
    <circle cx="1230" cy="970" r="10" fill="url(#iconGradientBlue)"/>

    <text class="card-title" x="1210" y="960">
      BlockDAG Network + Multi-Chain Support
    </text>
    <text class="card-body" x="1210" y="995">
      <tspan x="1210" dy="0">• Ethereum</tspan>
      <tspan x="1210" dy="28">• Polygon</tspan>
      <tspan x="1210" dy="28">• Arbitrum</tspan>
      <tspan x="1210" dy="28">• BlockDAG</tspan>
    </text>
  </g>

  <!-- Column 2 Arrows -->
  <line x1="1500" y1="572" x2="1500" y2="628"
        stroke="#60a5fa" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrow)" opacity="0.9"/>
  <line x1="1500" y1="852" x2="1500" y2="908"
        stroke="#60a5fa" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrow)" opacity="0.9"/>

  <!-- ========================================= -->
  <!-- COLUMN 3 — INTELLIGENCE & DATA LAYER     -->
  <!-- ========================================= -->

  <!-- 1. AI Analysis Engine -->
  <g>
    <rect x="2080" y="360" width="780" height="210" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="2080" y="360" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <circle cx="2130" cy="410" r="28" fill="url(#iconGradientPurple)"/>
    <text class="icon-label" x="2130" y="416" text-anchor="middle">AI</text>

    <text class="card-title" x="2180" y="400">AI Analysis Engine</text>
    <text class="card-body" x="2180" y="435">
      <tspan x="2180" dy="0">• Price predictions</tspan>
      <tspan x="2180" dy="28">• Market sentiment</tspan>
      <tspan x="2180" dy="28">• Risk alerts</tspan>
      <tspan x="2180" dy="28">• Trading suggestions</tspan>
    </text>
  </g>

  <!-- 2. External APIs -->
  <g>
    <rect x="2080" y="640" width="780" height="190" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="2080" y="640" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <circle cx="2130" cy="690" r="26" fill="url(#iconGradientBlue)"/>
    <text class="icon-label" x="2130" y="696" text-anchor="middle">API</text>

    <text class="card-title" x="2180" y="680">External APIs</text>
    <text class="card-body" x="2180" y="715">
      <tspan x="2180" dy="0">• CoinGecko (price feeds)</tspan>
      <tspan x="2180" dy="28">• Market analytics sources</tspan>
      <tspan x="2180" dy="28">• Other data providers</tspan>
    </text>
  </g>

  <!-- 3. Supabase Edge Functions (optional) -->
  <g>
    <rect x="2080" y="920" width="780" height="200" rx="26"
          fill="url(#cardGradient)"
          stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"
          filter="url(#cardShadow)"/>
    <rect x="2080" y="920" width="780" height="4" rx="2"
          fill="url(#accentGradientBluePurple)" opacity="0.9"/>

    <circle cx="2130" cy="970" r="26" fill="url(#iconGradientPurple)"/>
    <text class="icon-label" x="2130" y="976" text-anchor="middle">Fx</text>

    <text class="card-title" x="2180" y="960">Supabase Edge Functions (optional)</text>
    <text class="card-body" x="2180" y="995">
      <tspan x="2180" dy="0">• Server-side logic close to the data</tspan>
      <tspan x="2180" dy="28">• Secure API intermediaries</tspan>
      <tspan x="2180" dy="28">• Data validation &amp; transformation</tspan>
    </text>
  </g>

  <!-- Column 3 Arrows -->
  <line x1="2470" y1="582" x2="2470" y2="628"
        stroke="#60a5fa" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrow)" opacity="0.9"/>
  <line x1="2470" y1="842" x2="2470" y2="908"
        stroke="#60a5fa" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrow)" opacity="0.9"/>

  <!-- Footnote -->
  <text class="footnote" x="1500" y="1840" text-anchor="middle">
    High-level architecture of Truce Wallet — left: current React + Supabase app, center: planned blockchain flow, right: AI &amp; data layer.
  </text>
</svg>